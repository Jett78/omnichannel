services:
  postgres:
    image: postgres:16-alpine
    container_name: uoi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uoi
      POSTGRES_PASSWORD: uoi_password
      POSTGRES_DB: uoi
    ports:
      - "5432:5432"
    volumes:
      - uoi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uoi -d uoi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: uoi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - uoi-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Optional app services (profile: app) ──────────────────────────────────
  # docker compose --profile app up --build
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uoi-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://uoi:uoi_password@postgres:5432/uoi?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uoi-worker
    restart: unless-stopped
    command: npm run worker
    environment:
      DATABASE_URL: postgresql://uoi:uoi_password@postgres:5432/uoi?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  uoi-postgres-data:
  uoi-redis-data:
